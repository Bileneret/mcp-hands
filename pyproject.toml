[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "office: живые тесты COM-исполнителя Word (медленные: поднимают Word)",
    "llm_live: живые тесты LLM-провайдера (нужен config.local.json с ключом, тратят токены)",
]
# Тесты ядра работают на живом Windows-стенде: поднимают окна-мишени, ходят в UIA,
# кликают и захватывают экран. Параллельный запуск запрещён — мишени мешали бы друг другу.
